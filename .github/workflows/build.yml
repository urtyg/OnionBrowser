name: Build IPA

on:
  push:
    branches: [ "3.X" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build Archive
      run: |
        xcodebuild archive \
          -workspace OnionBrowser.xcworkspace \
          -scheme OnionBrowser \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/OnionBrowser.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package IPA
      run: |
        mkdir -p build/Payload
        cp -R build/OnionBrowser.xcarchive/Products/Applications/OnionBrowser.app build/Payload/
        cd build
        zip -r OnionBrowser.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: OnionBrowser-Unsigned
        path: build/OnionBrowser.ipa
